name: release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# Jobs receive a read-only token; only the publish job raises it.
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
# Third-party code is pinned to a commit; Dependabot proposes updates.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run check
      - name: Check Go formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l . >&2; exit 1; }
      - run: go vet ./...
        working-directory: backend
      - run: go test -race ./...
        working-directory: backend
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag must match package.json version" >&2
            exit 1
          fi
  # Reported separately so a new advisory is visible without hiding build results.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: backend
      - run: npm audit --audit-level=high
      - run: npm --prefix frontend audit --audit-level=high
  packages:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            targets: --linux AppImage deb rpm pacman
          - os: windows-2025
            arch: x64
            targets: --win nsis portable
          - os: macos-26
            arch: x64
            targets: --mac dmg
          - os: macos-26
            arch: arm64
            targets: --mac dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install RPM and pacman packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run build
        env:
          BACKEND_ARCH: ${{ matrix.arch }}
      - run: npx --no-install electron-builder $TARGETS "--$ARCH" --publish never
        env:
          TARGETS: ${{ matrix.targets }}
          ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.exe
            dist/*.dmg
            !dist/*.__uninstaller.exe
          if-no-files-found: error
  flatpak:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.electronjs.Electron2.BaseApp//26.08
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run build
      - run: npx --no-install electron-builder --linux flatpak --x64 --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-flatpak
          path: dist/*.flatpak
          if-no-files-found: error
  snap:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - run: sudo snap install snapcraft --classic
      # snap/snapcraft.yaml builds the application from source inside the container.
      - run: snapcraft
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-snap
          path: '*.snap'
          if-no-files-found: error
  snap-store:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: snap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-snap
          path: artifacts
      # Snapcraft 8 still accepts credentials exported through the web login.
      - run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Upload to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          # The credentials were exported through the web login.
          SNAPCRAFT_STORE_AUTH: candid
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS secret is not set" >&2
            exit 1
          fi
          snapcraft upload --release=stable artifacts/*.snap
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, flatpak, snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts
      - run: cd artifacts && sha256sum * > SHA256SUMS
      # The preinstalled GitHub CLI avoids giving a third-party action write access.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
