name: Feature request
description: Suggest something the application should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: scope
    attributes:
      label: Providers it applies to
      options: [Every S3-compatible service, Amazon S3 only, One provider (say which below)]
