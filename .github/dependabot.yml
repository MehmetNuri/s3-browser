version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: [/, /frontend]
    schedule:
      interval: weekly
    ignore:
      # svelte-check cannot run on TypeScript 7 without a second TypeScript 6 install.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
