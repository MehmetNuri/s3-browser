name: s3browser
title: S3 Browser
summary: Desktop client for Amazon S3 and S3-compatible storage
description: |
  S3 Browser is a desktop client for Amazon S3, Supabase Storage, MinIO,
  Cloudflare R2 and other S3-compatible services. Browse buckets, transfer
  and preview objects, sync and back up folders, manage object versions and
  analyze storage. The interface is available in nine languages, including
  right-to-left Arabic.
license: Apache-2.0
website: https://github.com/MehmetNuri/s3-browser
source-code: https://github.com/MehmetNuri/s3-browser
issues: https://github.com/MehmetNuri/s3-browser/issues
icon: packaging/icons/s3browser-512.png
base: core24
grade: stable
confinement: strict
adopt-info: s3browser
platforms:
  amd64:

# Chromium's own sandbox needs user namespaces under strict confinement.
plugs:
  browser-support:
    interface: browser-support
    allow-sandbox: true

apps:
  s3browser:
    command: app/s3browser
    extensions: [gnome]
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - browser-support
      - network
      - home
      - removable-media
      - unity7
      - desktop-legacy
      - password-manager-service

parts:
  # Built from source so the Snap Store build service can produce the snap as well.
  s3browser:
    plugin: nil
    source: .
    build-snaps:
      - node/24/stable
      - go/1.27/stable
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
      - libsecret-1-0
    build-environment:
      # Build services reach the network through a proxy.
      - ELECTRON_GET_USE_PROXY: "1"
      - GOTOOLCHAIN: auto
    override-build: |
      craftctl set version="$(grep -m1 '"version"' package.json | cut -d'"' -f4)"
      npm ci
      npm --prefix frontend ci
      npm run build
      npx --no-install electron-builder --linux dir --publish never -c.electronDist=node_modules/electron/dist
      mkdir -p "$CRAFT_PART_INSTALL/app"
      cp -a dist/linux*unpacked/. "$CRAFT_PART_INSTALL/app/"
